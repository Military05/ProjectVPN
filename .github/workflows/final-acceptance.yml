name: Final PostgreSQL Redis and Docker acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - src/**
      - tests/**
      - alembic/**
      - Dockerfile
      - docker-compose.yml
      - pyproject.toml
      - requirements/**
      - .env.example
      - .github/workflows/final-acceptance.yml

permissions:
  contents: read

concurrency:
  group: final-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-postgresql-redis-suite:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: projectvpn_acceptance
          POSTGRES_USER: shopbot
          POSTGRES_PASSWORD: integration-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shopbot -d projectvpn_acceptance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://shopbot:integration-only-password@127.0.0.1:5432/projectvpn_acceptance
      REDIS_URL: redis://127.0.0.1:6379/0
      PROJECTVPN_CHANGE03_TEST_DATABASE_URL: postgresql+asyncpg://shopbot:integration-only-password@127.0.0.1:5432/projectvpn_acceptance
      PROJECTVPN_CHANGE12_TEST_DATABASE_URL: postgresql+asyncpg://shopbot:integration-only-password@127.0.0.1:5432/projectvpn_acceptance
      PROJECTVPN_MIGRATION_0010_TEST_DATABASE_URL: postgresql+asyncpg://shopbot:integration-only-password@127.0.0.1:5432/projectvpn_acceptance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked development dependencies
        run: |
          python -m pip install --require-hashes -r requirements/dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Run every test against real services
        run: python -m pytest -q --junitxml=pytest-results.xml
      - name: Require zero failures and zero skipped tests
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          root = ElementTree.parse(Path("pytest-results.xml")).getroot()
          suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
          totals = {
              key: sum(int(suite.attrib.get(key, "0")) for suite in suites)
              for key in ("tests", "failures", "errors", "skipped")
          }
          print(totals)
          assert totals["tests"] > 0
          assert totals["failures"] == 0
          assert totals["errors"] == 0
          assert totals["skipped"] == 0
          PY

  clean-docker-stack:
    needs: full-postgresql-redis-suite
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: projectvpn-final-acceptance
    steps:
      - uses: actions/checkout@v4
      - name: Prepare disposable acceptance environment
        run: |
          cp .env.example .env
          sed -i 's|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=ci-only-database-password|' .env
          sed -i 's|^DATABASE_URL=.*|DATABASE_URL=postgresql+asyncpg://shopbot:ci-only-database-password@postgres:5432/shopbot|' .env
          sed -i 's|^INTERNAL_API_KEY=.*|INTERNAL_API_KEY=ci-only-internal-key|' .env
          sed -i 's|^ADMIN_API_TOKEN=.*|ADMIN_API_TOKEN=ci-only-admin-token|' .env
          sed -i 's|^BOT_TOKEN=.*|BOT_TOKEN=123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi|' .env
          sed -i 's|^NODE_AGENT_SHARED_SECRET=.*|NODE_AGENT_SHARED_SECRET=ci-only-node-secret|' .env
          sed -i 's|^DEMO_NODE_SHARED_SECRET=.*|DEMO_NODE_SHARED_SECRET=ci-only-node-secret|' .env
          sed -i 's|^AUTO_SEED_DEMO_DATA=.*|AUTO_SEED_DEMO_DATA=true|' .env
          sed -i 's|^DEMO_NODE_AUTO_REGISTER=.*|DEMO_NODE_AUTO_REGISTER=true|' .env
      - name: Build every application image without cache
        run: docker compose build --no-cache
      - name: Start data services, node agent and migrations
        run: docker compose up -d postgres redis node-agent migrate
      - name: Require successful migration container
        run: |
          container_id="$(docker compose ps -q migrate)"
          for _ in $(seq 1 60); do
            status="$(docker inspect --format '{{.State.Status}}' "$container_id")"
            if [ "$status" = "exited" ]; then
              exit_code="$(docker inspect --format '{{.State.ExitCode}}' "$container_id")"
              test "$exit_code" = "0"
              exit 0
            fi
            sleep 2
          done
          echo "Migration container did not finish in time" >&2
          exit 1
      - name: Start API, worker and Prometheus
        run: docker compose up -d api worker prometheus
      - name: Wait for schema-aware API readiness
        run: |
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/health/ready; then
              exit 0
            fi
            sleep 2
          done
          echo "API readiness did not become healthy in time" >&2
          exit 1
      - name: Smoke runtime services and admin UI
        run: |
          test "$(docker compose exec -T postgres psql -U shopbot -d shopbot -tAc 'SELECT version_num FROM alembic_version')" = "20260913_0010"
          test "$(docker compose exec -T redis redis-cli ping)" = "PONG"
          curl --fail --silent --show-error http://127.0.0.1:8080/health/live | grep -q '"status":"ok"'
          curl --fail --silent --show-error http://127.0.0.1:8080/health/ready | grep -q '"status":"ready"'
          curl --fail --silent --show-error http://127.0.0.1:8080/admin-ui | grep -q 'VLESS ShopBot Admin'
          curl --fail --silent --show-error http://127.0.0.1:8080/admin-ui/assets/app.js | grep -q 'SERVER_PAGE_SIZE = 50'
          curl --fail --silent --show-error http://127.0.0.1:8090/openapi.json | grep -q 'vless-shopbot node agent'
          curl --fail --silent --show-error http://127.0.0.1:9090/-/ready | grep -q 'Prometheus Server is Ready'
          curl --fail --silent --show-error \
            -H 'X-Admin-Token: ci-only-admin-token' \
            http://127.0.0.1:8080/admin/tariffs | grep -q '1 month'
          headers="$(mktemp)"
          curl --fail --silent --show-error \
            -D "$headers" -o /dev/null \
            -H 'X-Admin-Token: ci-only-admin-token' \
            'http://127.0.0.1:8080/admin/nodes?limit=50&offset=0'
          grep -qi '^x-page-limit: 50' "$headers"
          grep -qi '^x-page-offset: 0' "$headers"
          grep -qi '^x-has-more: false' "$headers"
          for service in api worker node-agent postgres redis prometheus; do
            docker compose ps --status running --services | grep -qx "$service"
          done
      - name: Smoke bot composition without contacting Telegram
        run: |
          docker compose run --rm --no-deps -T bot python - <<'PY'
          import asyncio

          from aiogram import Bot, Dispatcher
          from aiogram.client.default import DefaultBotProperties
          from aiogram.enums import ParseMode

          from shop_bot.apps.bot.clients.backend_api import BackendApiClient
          from shop_bot.apps.bot.handlers import setup_router
          from shop_bot.bootstrap.container import build_container


          async def main() -> None:
              container = await build_container(
                  include_arq_pool=False,
                  service_name="shopbot-bot-acceptance",
              )
              bot = Bot(
                  token=container.settings.bot_token,
                  default=DefaultBotProperties(parse_mode=ParseMode.HTML),
              )
              backend = BackendApiClient(container.settings)
              dispatcher = Dispatcher()
              dispatcher.include_router(
                  setup_router(
                      backend=backend,
                      deduplicator=container.deduplicator,
                      provider=container.settings.payment_default_provider,
                      dedup_ttl_seconds=container.settings.bot_dedup_ttl_seconds,
                  )
              )
              assert dispatcher.sub_routers
              await backend.close()
              await bot.session.close()
              await container.close()


          asyncio.run(main())
          PY
      - name: Show Docker state and logs after failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200
      - name: Remove disposable stack
        if: always()
        run: docker compose down --volumes --remove-orphans
