name: PostgreSQL migration 0010

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - alembic/**
      - src/shop_bot/infrastructure/persistence/sqlalchemy/metadata_v1.py
      - tests/integration/test_migration_0010_postgresql.py
      - .github/workflows/postgresql-migration-0010.yml

jobs:
  migration-0010:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: projectvpn_migration_test
          POSTGRES_USER: shopbot
          POSTGRES_PASSWORD: integration-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shopbot -d projectvpn_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PROJECTVPN_MIGRATION_0010_TEST_DATABASE_URL: postgresql+asyncpg://shopbot:integration-only-password@127.0.0.1:5432/projectvpn_migration_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked development dependencies
        run: |
          python -m pip install --require-hashes -r requirements/dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Exercise rolling upgrade 0009 to 0010
        run: python -m pytest -q tests/integration/test_migration_0010_postgresql.py
