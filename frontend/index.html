<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VPN Multi-node Interface</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f4; }
        .channel { display: flex; align-items: center; margin: 5px 0; }
        .flag { font-size: 24px; margin-right: 10px; }
        .name { flex: 1; }
        button { margin-left: 5px; }
        #v2raytan { width: 100%; height: 150px; }
    </style>
</head>
<body>
    <h2>VPN Multi-node Interface</h2>
    <div id="channels"></div>
    <button onclick="refreshChannels()">Обновить каналы</button>
    <h3>V2RayTan ссылка</h3>
    <textarea id="v2raytan" readonly></textarea>

<script>
async function refreshChannels() {
    const res = await fetch("http://localhost:8000/channels");
    const channels = await res.json();
    const container = document.getElementById("channels");
    container.innerHTML = "";
    channels.forEach(c => {
        const div = document.createElement("div");
        div.className = "channel";
        div.innerHTML = `<span class="flag">${c.flag}</span><span class="name">${c.name}</span>
                         <button onclick="connect('${c.server}', ${c.port})">Подключить</button>`;
        container.appendChild(div);
    });

    // Получаем ссылку V2RayTan
    const linkRes = await fetch("http://localhost:8000/v2raytan-link");
    const linkData = await linkRes.json();
    document.getElementById("v2raytan").value = linkData.v2raytan_link;
}

function connect(server, port) {
    alert(`Подключение к ${server}:${port} (эмуляция)`); 
}

refreshChannels();
</script>
</body>
</html>
